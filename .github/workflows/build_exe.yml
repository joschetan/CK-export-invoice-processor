name: Build Desktop App ZIP
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Create Launch Script
      run: |
        echo "@echo off" > run_app.bat
        echo "echo Starting CK Export Processor..." >> run_app.bat
        echo "python -m pip install --upgrade pip" >> run_app.bat
        echo "pip install streamlit pandas openpyxl requests" >> run_app.bat
        echo "streamlit run app.py" >> run_app.bat
    - uses: actions/upload-artifact@v4
      with:
        name: CK-Export-Processor-Desktop
        path: |
          *.py
          *.bat
          requirements.txt
