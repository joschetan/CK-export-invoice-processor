name: Build Desktop EXE Backup
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        pip install streamlit pandas openpyxl requests pdfplumber pyinstaller
    - name: Create EXE
      run: |
        pyinstaller --onedir --noconsole --collect-all streamlit --collect-all pandas --collect-all openpyxl --collect-all pdfplumber app.py
    - uses: actions/upload-artifact@v4
      with:
        name: CK-Export-Processor-Folder
        path: dist/app/
